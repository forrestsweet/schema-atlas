<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Schema Atlas local-first architecture</title>
  <desc id="desc">MySQL DDL is parsed in a Web Worker, rendered on a Canvas graph, persisted in IndexedDB, and provided to a Schema Copilot.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#737373"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="20" fill="#fafafa"/>
  <rect x="24" y="24" width="1152" height="292" rx="16" fill="#fff" stroke="#d4d4d4" stroke-dasharray="7 7"/>
  <text x="52" y="60" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#525252">LOCAL BROWSER</text>

  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="66" y="106" width="220" height="132" rx="14" fill="#fff" stroke="#d4d4d4"/>
    <text x="176" y="151" text-anchor="middle" font-size="19" font-weight="650" fill="#171717">MySQL DDL</text>
    <text x="176" y="181" text-anchor="middle" font-size="14" fill="#737373">File · Drop · Paste</text>

    <rect x="350" y="106" width="220" height="132" rx="14" fill="#f5f5f5" stroke="#d4d4d4"/>
    <text x="460" y="151" text-anchor="middle" font-size="19" font-weight="650" fill="#171717">Web Worker</text>
    <text x="460" y="181" text-anchor="middle" font-size="14" fill="#737373">node-sql-parser</text>

    <rect x="634" y="82" width="220" height="92" rx="14" fill="#fff" stroke="#d4d4d4"/>
    <text x="744" y="121" text-anchor="middle" font-size="19" font-weight="650" fill="#171717">Canvas Graph</text>
    <text x="744" y="149" text-anchor="middle" font-size="14" fill="#737373">AntV G6</text>

    <rect x="634" y="194" width="220" height="92" rx="14" fill="#fff" stroke="#d4d4d4"/>
    <text x="744" y="233" text-anchor="middle" font-size="19" font-weight="650" fill="#171717">IndexedDB</text>
    <text x="744" y="261" text-anchor="middle" font-size="14" fill="#737373">Schemas · Threads</text>

    <rect x="918" y="106" width="220" height="132" rx="14" fill="#171717" stroke="#171717"/>
    <text x="1028" y="151" text-anchor="middle" font-size="19" font-weight="650" fill="#fff">Schema Copilot</text>
    <text x="1028" y="181" text-anchor="middle" font-size="14" fill="#d4d4d4">Pi · assistant-ui</text>
  </g>

  <g fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)">
    <path d="M286 172H338"/>
    <path d="M570 154L622 132"/>
    <path d="M570 190L622 230"/>
    <path d="M854 128H906"/>
    <path d="M854 240L906 196"/>
  </g>
</svg>
